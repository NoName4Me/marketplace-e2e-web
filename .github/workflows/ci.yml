name: Test and publish GHCR image
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify web app and container
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Run contract and interaction tests
        run: npm run check
      - name: Build a local deployment image
        run: |
          docker build --build-arg BUILD_SHA="${{ github.sha }}" \
            --build-arg BUILD_TIME="2026-10-15T00:00:00Z" \
            -t marketplace-e2e:ci .
      - name: Verify actual container and task operations
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm --name marketplace-e2e-smoke \
            -p 127.0.0.1:18080:8080 marketplace-e2e:ci
          trap 'docker logs marketplace-e2e-smoke || true; docker rm -f marketplace-e2e-smoke || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:18080/readyz >/dev/null; then break; fi
            sleep 2
          done
          bash scripts/smoke.sh http://127.0.0.1:18080 "${{ github.sha }}"

  publish:
    name: Publish immutable multi-architecture image
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare immutable image coordinates
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@05340b5f76a31cfccf046307130d1aa1b7ecbf1a # v3
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push linux/arm64 + linux/amd64
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.meta.outputs.built_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Publish fixed Digest for marketplace
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "## Verified E2E image" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "GHCR image (pin this in the portal):" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$IMAGE@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Platforms: linux/arm64, linux/amd64." >> "$GITHUB_STEP_SUMMARY"
